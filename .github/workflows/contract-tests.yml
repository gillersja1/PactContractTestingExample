name: Contract Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  consumer:
    name: Consumer (generate pact)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Run consumer contract tests
        run: >
          dotnet test tests/Users.Consumer.ContractTests
          --logger "trx;LogFileName=consumer.trx"
          --results-directory ./TestResults

      # In a team setup this is where the pact would be published to a Pact
      # Broker; here the provider job picks it up as an artifact.
      - name: Upload pact
        uses: actions/upload-artifact@v4
        with:
          name: pact
          path: pacts/

      - name: Send test results to Grafana
        if: always()
        uses: gillersja1/test-results-otel@v1
        with:
          results: TestResults/consumer.trx
          suite: consumer
          otlp-endpoint: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
          otlp-headers: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}

      - name: Consumer test report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Consumer contract tests
          path: TestResults/*.trx
          reporter: dotnet-trx

  provider:
    name: Provider (verify pact)
    runs-on: ubuntu-latest
    needs: consumer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Download pact
        uses: actions/download-artifact@v4
        with:
          name: pact
          path: pacts/

      - name: Verify provider against pact
        run: >
          dotnet test tests/Users.Provider.ContractTests
          --logger "trx;LogFileName=provider.trx"
          --logger "console;verbosity=normal"
          --results-directory ./TestResults

      - name: Send test results to Grafana
        if: always()
        uses: gillersja1/test-results-otel@v1
        with:
          results: TestResults/provider.trx
          suite: provider
          otlp-endpoint: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
          otlp-headers: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}

      - name: Provider test report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Provider verification
          path: TestResults/*.trx
          reporter: dotnet-trx
